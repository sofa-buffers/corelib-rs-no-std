name: no-std (Cortex-M0)

# One workflow per bare-metal target; the matrix over feature configurations
# lives in the shared body (`no-std-target.yml`), so every target is covered
# the same way and adding one is this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes the in-flight run for the same branch
# instead of both queueing for the 20 shared runner slots. `main` is excluded so
# a push to main is never cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The bound for the work lives on the jobs in `no-std-target.yml`: a job that
# calls a reusable workflow only forwards inputs, and GitHub does not accept
# `timeout-minutes` on such a calling job — the callee's jobs carry it.

jobs:
  cortex-m0:
    uses: ./.github/workflows/no-std-target.yml
    with:
      target: thumbv6m-none-eabi
      label: Cortex-M0
