name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Bare-metal coverage lives in its own workflow per target
# (`no-std-cortex-m0.yml`, `no-std-cortex-m4f.yml`, `no-std-riscv32.yml`), each
# building the library across a matrix of feature configurations, sweeping the
# whole feature powerset for that target and reporting its footprint. This
# workflow is the host side: lint, tests, vectors, the feature powerset and
# coverage.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same current stable as the `test` matrix: a floating
      # `stable` would turn this job red on a new Clippy release without any
      # code change. Bump together with the matrix in `test`.
      - name: Install Rust toolchain (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Lints the default + dev-target build for fast feedback; the `features`
      # job lints every individual feature combination (incl. the 32-bit width).
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test across the toolchains that matter for a compiler-versioned
        # language (§12.1). Only stable channels — no beta/nightly.
        #
        # - `stable`: whatever is current on the day of the run. Floating on
        #   purpose, so a regression in a fresh release surfaces here instead of
        #   after the next pin bump.
        # - 1.97/1.96/1.95: the current stable and its two predecessors, pinned
        #   so a green run stays reproducible. Bump when a new stable ships.
        # - 1.70: the declared MSRV (Cargo.toml `rust-version`), so an
        #   accidental MSRV bump fails CI.
        toolchain: [stable, "1.97", "1.96", "1.95", "1.70"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # `--locked` enforces the committed Cargo.lock so the MSRV (1.70) job
      # tests the exact pinned dependency tree. Without it the resolver pulls
      # the newest semver-compatible versions, and serde_json's transitive deps
      # (zmij, syn, quote, …) keep bumping their own MSRV past 1.70 in patch
      # releases — silently breaking this job.
      - name: Build (all features, debug)
        run: cargo build --locked --all-features --verbose

      # The size-optimized release profile is the shipping config for this
      # crate, so it must build (and stay MSRV-clean) too (§12.1 step 4).
      - name: Build (all features, release)
        run: cargo build --locked --all-features --release --verbose

      - name: Test (all features)
        run: cargo test --locked --all-features --verbose

      - name: Test (default features)
        run: cargo test --locked --verbose

  vectors:
    name: Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # Replay the shared conformance vectors under each feature config as its own
      # step, so the step list shows at a glance which config passed or failed —
      # all in one job, so the toolchain and cargo cache are still set up only
      # once. The suite is `requires`-aware: each config runs the vectors it can
      # represent and skips the rest. `if: ${{ !cancelled() }}` on the later steps
      # keeps every config running even after one fails (old `fail-fast: false`).
      - name: Vectors — full, 64-bit
        run: cargo test --test vectors_tests --all-features --verbose

      - name: Vectors — integers only, 32-bit
        if: ${{ !cancelled() }}
        run: cargo test --test vectors_tests --no-default-features --verbose

      - name: Vectors — full wire, 32-bit width
        if: ${{ !cancelled() }}
        run: cargo test --test vectors_tests --no-default-features --features fixlen,array,sequence,fp64 --verbose

      - name: Vectors — integers only, 64-bit
        if: ${{ !cancelled() }}
        run: cargo test --test vectors_tests --no-default-features --features value64 --verbose

      - name: Vectors — scalars + floats only
        if: ${{ !cancelled() }}
        run: cargo test --test vectors_tests --no-default-features --features fixlen,fp64,value64 --verbose

      - name: Vectors — no fixlen
        if: ${{ !cancelled() }}
        run: cargo test --test vectors_tests --no-default-features --features array,sequence,value64 --verbose

  features:
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Compile + lint *every* combination of feature flags (2^N configs,
      # including the 32-bit value width = no `value64`). Catches `cfg` mistakes
      # that only surface when a feature is off. `--no-dev-deps` keeps it to the
      # library (the conformance test crates need all wire types to compile).
      - name: Clippy every feature combination (library)
        run: cargo hack --feature-powerset --no-dev-deps clippy --lib -- -D warnings

      # Behavioural smoke test (encode -> decode) under every combination. The
      # config_tests crate is `cfg`-gated so it builds and runs for any subset.
      - name: Test every feature combination (config smoke tests)
        run: cargo hack --feature-powerset test --test config_tests

  bench-tools:
    name: Bench tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # §10/§13 require the perf and bench tools to be present *and runnable*.
      # Both are `harness = false` bench targets, so cargo appends its own
      # `--bench` flag to every run — which once made the documented invocation
      # exit 2 without anything in CI noticing. Each tool runs a ~1 s CPU-time
      # loop per workload, so `bench` takes ~11 s for BENCH_SPEC's ten rows.
      # The numbers are not asserted here, but the tools are not merely started
      # either: both fail the step if their message sizes miss the cross-port
      # parity checks (170 / 1,000,005 / 956 bytes), and `bench` additionally
      # self-checks each workload's shape before timing anything. The datasets
      # themselves are asserted in the `test` job
      # (`tests/bench_workloads_tests.rs`).
      - name: Throughput table (cargo bench --bench bench)
        run: cargo bench --bench bench

      - name: Per-op cost (cargo bench --bench perf)
        run: cargo bench --bench perf

      # The other entry point into the same binary: `run_callgrind.sh` runs it
      # as `bench <workload>` for exactly one op and reads `BYTES=` off stderr.
      # Checked without valgrind (not installed on the runner) — only that the
      # workload is still selected and reports its size.
      - name: Callgrind workload mode (bench <workload>)
        run: |
          BIN="$(cargo bench --bench bench --no-run --message-format=json 2>/dev/null \
              | grep -o '"executable":"[^"]*/bench-[^"]*"' | head -1 \
              | sed 's/.*"executable":"//;s/"$//')"
          test -x "$BIN" || { echo "bench binary not found"; exit 1; }
          for w in encode_u64_array encode_typical encode_blob_oneshot \
                   encode_blob_streaming encode_composite decode_u64_array \
                   decode_typical decode_blob decode_composite decode_composite_skip; do
            out="$("$BIN" "$w" 2>&1 >/dev/null)"
            echo "$w -> $out"
            case "$out" in BYTES=[0-9]*) ;; *) echo "workload $w did not run"; exit 1;; esac
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the badge JSON to the `badges` branch
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.97)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: llvm-tools-preview

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --all-features --summary-only --json --output-path coverage.json
          PCT=$(jq '.data[0].totals.lines.percent' coverage.json)
          printf 'line coverage: %.1f%%\n' "$PCT"
          echo "COVERAGE_PCT=$PCT" >> "$GITHUB_ENV"

      # Publish a Shields.io endpoint badge driven by the real CI coverage
      # number. The JSON lives on an orphan `badges` branch so it never
      # clutters main; the README points Shields at its raw URL.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          PCT_INT=$(printf '%.0f' "$COVERAGE_PCT")
          if   [ "$PCT_INT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$PCT_INT" -ge 75 ]; then COLOR=green
          elif [ "$PCT_INT" -ge 60 ]; then COLOR=yellowgreen
          elif [ "$PCT_INT" -ge 40 ]; then COLOR=orange
          else COLOR=red; fi
          MSG=$(printf '%.1f%%' "$COVERAGE_PCT")
          mkdir badge-out && cd badge-out
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s"}\n' "$MSG" "$COLOR" > coverage.json
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.json
          git commit -q -m "chore: update coverage badge ($MSG)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
