name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token plus the scopes the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every job below carries a `timeout-minutes`. The org's Actions concurrency is
# 20 runners, so a step that wedges holds a slot the rest of the family queues
# behind — and GitHub's 360-minute default means it holds it for six hours.
# A bound of roughly 4x the observed runtime makes a hung job fail fast and
# name itself instead. Observed on recent runs: every job here finishes in
# under two minutes.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # Document only this crate (not its deps); fail on broken intra-doc links.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      # rustdoc emits target/doc/<crate>/index.html; add a root redirect so the
      # Pages site lands on the crate docs instead of a bare directory listing.
      - name: Add index redirect
        run: echo '<meta http-equiv="refresh" content="0; url=sofab/index.html">' > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
